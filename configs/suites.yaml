# Benchmark suites run through EvalScope.
#
# profiles:
#   smoke = connectivity check, lite = quick comparable slice, full = whole dataset
#   unless `full_per_subset_limit` caps it (EvalScope's limit applies per subset).
# Dataset spec fields:
#   core                    run by default (core: false needs --include-extensions)
#   full_per_subset_limit   per-subset cap used only by the `full` profile
#   pinned                  always limit=1 (used with a local, pre-filtered dataset)
#   local_path              local dataset dir; ${DATA_ROOT} expands to --data-root
#   dataset_args            passed through to EvalScope dataset_args[<dataset>]
#   extra_params            merged into dataset_args[<dataset>].extra_params
#   generation_config       merged over the model generation config for this dataset
#   agent_config            EvalScope NativeAgentConfig (mode/max_steps/command_timeout)
#   eval_batch_size         per-dataset override
#   sandbox                 per-dataset override of the suite sandbox config
#   requires_sandbox        true = code executes in a sandbox; no host fallback
#   requires                importable modules checked during preflight
#   status                  tested | configured (not yet executed) | requires-extra-deps

profiles:
  smoke: {limit: 5}
  lite:  {limit: 20}
  full:  {limit: null}

defaults:
  eval_batch_size: 4

suites:
  knowledge:
    datasets:
      gpqa_diamond: {core: true, status: tested}
      math_500:     {core: true, status: tested}
      ifeval:       {core: true, status: tested, requires: [langdetect]}
      mmlu_pro:         {core: false, full_per_subset_limit: 500, status: configured}
      zebralogicbench:  {core: false, full_per_subset_limit: 200, status: configured}

  swe:
    # One container per sample; never run these in parallel batches on this host.
    eval_batch_size: 1
    sandbox: {enabled: true, engine: docker}
    datasets:
      swe_bench_verified:
        core: true
        status: tested
        full_per_subset_limit: 50
        requires: [swebench]
        requires_sandbox: true
        dataset_args:
          inference_dataset_id: princeton-nlp/SWE-bench_oracle
      swe_bench_verified_agentic:
        core: true
        pinned: true
        status: tested
        requires: [swebench, ms_enclave]
        requires_sandbox: true
        local_path: ${DATA_ROOT}/pinned/swe_bench_verified_django1
        agent_config:
          mode: native
          max_steps: 250
          command_timeout: 60.0
        extra_params:
          build_docker_images: true
          pull_remote_images_if_available: true
        generation_config:
          temperature: 0.7
          parallel_tool_calls: true
          stream: true
      live_code_bench:
        core: true
        status: tested
        # 28 subsets x limit items; execute in parallel instead of one by one.
        eval_batch_size: 4
        full_per_subset_limit: 100
        requires_sandbox: true
      swe_bench_pro:            {core: false, status: configured, requires: [ms_enclave], requires_sandbox: true}
      terminal_bench_v2_1:      {core: false, status: requires-extra-deps, requires: [harbor], requires_sandbox: true}
      swe_bench_lite_agentic:   {core: false, status: configured, requires: [swebench, ms_enclave], requires_sandbox: true}
      bigcodebench:             {core: false, status: configured, requires_sandbox: true}

  vision:
    datasets:
      ocr_bench_v2: {core: true, status: tested, full_per_subset_limit: 1000, requires: [apted, distance, Levenshtein, lxml, Polygon, zss, jieba, nltk, editdistance]}
      docvqa:       {core: true, status: tested, full_per_subset_limit: 1000}
      math_vista:   {core: true, status: tested}
      ocr_bench:            {core: false, status: configured, requires: [apted, distance, Levenshtein, lxml, Polygon, zss, jieba, nltk, editdistance]}
      cc_ocr_v2:            {core: false, status: configured, full_per_subset_limit: 500}
      mmmu:                 {core: false, status: configured}
      mmmu_pro:             {core: false, status: configured, full_per_subset_limit: 500}
      vstar_bench:          {core: false, status: configured}
      chartqa:              {core: false, status: configured, requires_extras: judge}
      omni_doc_bench_v1_6:  {core: false, status: requires-extra-deps, requires_sandbox: true}
      olmocr_bench:         {core: false, status: requires-extra-deps, requires: [rapidfuzz, fuzzysearch]}
      maritime_ocr_bench:   {core: false, status: requires-extra-deps}
