# Models evaluated through OpenAI-compatible APIs.
#
# Secrets are never stored here: `api_key_env` names the environment variable
# that holds the key.  Add one entry per model to compare on the same suites.

models:
  minimax:
    model_id: MiniMax-M3.1-Flash-Preview
    api_url: https://api.minimax.cn/v1
    api_key_env: MINIMAX_API_KEY
    eval_type: openai_api
    generation_config:
      # Reasoning model: the answer comes after reasoning_content, keep this large.
      max_tokens: 32768
      temperature: 0.0
      timeout: 600
      retries: 3
      retry_interval: 10
